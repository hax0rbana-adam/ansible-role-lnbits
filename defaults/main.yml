# You should set this to a strong random value. For more info, see:
# https://github.com/lnbits/lnbits/blob/dev/.env.example
# lnbits_auth_secret_key:

# set the refspec to "main" if you want rolling releases
lnbits_git_refspec: v1.3.0
# set the commit to "HEAD" if you want rolling releases
lnbits_git_commit: 9cc6a964334f2d4ddbb7c7da926d8f96ab50d9c7
lnbits_add_poetry_config: true

# The default expects there's an lnd user who run the LND service
lnbits_user: lnd
lnbits_group: lnd
# The default binds to localhost and expects you to use nginx as a proxy
lnbits_host: 127.0.0.1
lnbits_backend_wallet: LndWallet
# When using hax0rbana_adam.lnd, this is where the lnd data directory resides
lnbits_grpc_cert: /data/lnd/tls.cert
lnbits_grpc_macaroon: /data/lnd/data/chain/bitcoin/mainnet/admin.macaroon
lnbits_rest_cert: /data/lnd/tls.cert
lnbits_rest_macaroon: /data/lnd/data/chain/bitcoin/mainnet/admin.macaroon
lnbits_allow_new_accounts: "false"
lnbits_node_ui: "true"
lnbits_node_ui_transactions: "true"
