# This role is expected to run as root so it can install system-wide packages
- name: Install dependencies
  ansible.builtin.package:
    name:
      - git
      - pkg-config
      - python3-poetry
      - python3-fastapi

- name: Checking to see if we already have a checkout of the LNBits repo
  ansible.builtin.stat:
    path: /usr/local/lnbits
  register: lnbits_repo

- name: Accepting different permissions on the existing LNBits checkout
  ansible.builtin.command:
    cmd: git config --global --add safe.directory '/usr/local/lnbits'
  when: lnbits_repo.stat.exists
  changed_when: true
  tags:
    - skip_ansible_lint  # we can't use the git module for this

- name: Making sure we have the latest version of the LNBits code
  ansible.builtin.git:
    # clone the repo if it doesn't exist, otherwise update the existing repo
    clone: "{{ not lnbits_repo.stat.exists }}"
    dest: "/usr/local/lnbits"
    force: true
    refspec: "{{ lnbits_git_refspec }}"
    version: "{{ lnbits_git_commit }}"
    repo: https://github.com/lnbits/lnbits.git

- name: Copying over default lnbits environment variables
  ansible.builtin.copy:
    src: /usr/local/lnbits/.env.example
    dest: /usr/local/lnbits/.env
    remote_src: true
    mode: 'u=rwX,g=rX,o='
    owner: '{{ lnbits_user }}'
    group: '{{ lnbits_group }}'
  # we only do this when we have never checked out the repo before
  when: not lnbits_repo.stat.exists

- name: Patch source code to support Python 3.13
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/pyproject.toml
    regexp: "^requires-python = .*"
    line: requires-python = ">=3.10,<3.14"
  register: patch

- name: Configuring LNBits to have the specified AUTH_SECRET_KEY
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^AUTH_SECRET_KEY=.*
    line: AUTH_SECRET_KEY="{{ lnbits_auth_secret_key }}"
  when: lnbits_auth_secret_key is defined

- name: Configuring LNBits to listen on all specified interfaces
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^HOST=.*
    line: HOST={{ lnbits_host }}

- name: Configuring whether new accounts should be allowed
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: "^#? ?LNBITS_ALLOW_NEW_ACCOUNTS=.*"
    line: LNBITS_ALLOW_NEW_ACCOUNTS={{ lnbits_allow_new_accounts }}

- name: Configuring whether the node management UI is displayed
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: "^LNBITS_NODE_UI=.*"
    line: LNBITS_NODE_UI={{ lnbits_node_ui }}

- name: Configuring whether transactions are shown in the node management UI
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: "^LNBITS_NODE_UI_TRANSACTIONS=.*"
    line: LNBITS_NODE_UI_TRANSACTIONS={{ lnbits_node_ui_transactions }}

- name: Configuring LNBits to use LND (GRPC) as a backend wallet
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^LNBITS_BACKEND_WALLET_CLASS=.*
    line: LNBITS_BACKEND_WALLET_CLASS={{ lnbits_backend_wallet }}

- name: Configuring LNBits GRPC to use the LND's TLS cert
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^LND_GRPC_CERT=.*
    line: LND_GRPC_CERT={{ lnbits_grpc_cert }}

- name: Configuring LNBits GRPC to use the LND admin macaroon
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^LND_GRPC_MACAROON=.*
    line: LND_GRPC_MACAROON={{ lnbits_grpc_macaroon }}

- name: Configuring LNBits REST to use the LND's TLS cert
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^LND_REST_CERT=.*
    line: LND_REST_CERT={{ lnbits_rest_cert }}

- name: Configuring LNBits REST to use the LND admin macaroon
  ansible.builtin.lineinfile:
    dest: /usr/local/lnbits/.env
    regexp: ^LND_REST_MACAROON=.*
    line: LND_REST_MACAROON={{ lnbits_rest_macaroon }}

- name: Setting permissions of the lnbits code
  ansible.builtin.file:
    path: /usr/local/lnbits
    recurse: true
    mode: 'u=rwX,g=rX,o='
    owner: '{{ lnbits_user }}'
    group: '{{ lnbits_group }}'

- name: Setting poetry to use python3
  ansible.builtin.command: poetry env use python3
  become: true
  become_user: '{{ lnbits_user }}'
  args:
    chdir: /usr/local/lnbits
  changed_when: true

- name: Updating lock file after our patch to support Python 3.13
  ansible.builtin.command: poetry lock
  become: true
  become_user: '{{ lnbits_user }}'
  args:
    chdir: /usr/local/lnbits
  when: patch.changed
  changed_when: true

- name: Installing needed python libraries using poetry
  ansible.builtin.command: poetry install --only main
  become: true
  become_user: '{{ lnbits_user }}'
  args:
    chdir: /usr/local/lnbits
  changed_when: true

- name: Deploying service to run LNBits
  ansible.builtin.template:
    src: templates/lnbits.service.j2
    dest: /etc/systemd/system/lnbits.service
    mode: '0644'
  notify:
    - Enable and start lnbits
